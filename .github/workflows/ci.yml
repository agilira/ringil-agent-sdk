name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      os:
        description: 'Systems to test: all, or some of linux windows macos'
        default: all

permissions:
  contents: read

jobs:
  # Which systems to test. All three by default; a commit message with
  # [ci windows], [ci linux] or [ci macos] (combinable) tests only those,
  # for a fix of one system: macOS minutes cost ten times Linux ones.
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
    - id: pick
      env:
        MESSAGE: ${{ github.event.head_commit.message }}
        CHOSEN: ${{ github.event.inputs.os }}
      run: |
        want="$CHOSEN"
        if [ -z "$want" ]; then
          for os in linux windows macos; do
            case "$MESSAGE" in *"[ci $os]"*) want="$want $os";; esac
          done
        fi
        list=""
        for os in $want; do
          case "$os" in
            linux) list="$list,\"ubuntu-latest\"";;
            windows) list="$list,\"windows-latest\"";;
            macos) list="$list,\"macos-latest\"";;
          esac
        done
        if [ -z "$list" ]; then list=',"ubuntu-latest","macos-latest","windows-latest"'; fi
        echo "os=[${list#,}]" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # Three first-class platforms: Harness must run on Windows.
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        check-latest: true
        cache: true
    - name: Sandbox prerequisites
      if: runner.os == 'Linux'
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
      # the sandbox needs them, as on a developer machine with bubblewrap.
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q bubblewrap socat
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        echo "RINGIL_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
    - name: Sandbox required (macOS)
      if: runner.os == 'macOS'
      run: echo "RINGIL_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
    - name: Library
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: MCP
      working-directory: mcp
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: OpenTelemetry
      working-directory: otel
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: A2A
      working-directory: a2a
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: Channel (Slack)
      working-directory: channel/slack
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: Memory (SQLite)
      working-directory: memory/sqlite
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: Provider (Anthropic)
      working-directory: provider/anthropic
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: Secrets (keyring)
      working-directory: secrets/keyring
      # The live tests use the runner's own keychain or credential
      # manager, with a service of their own; Linux runners have none.
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./... && go test -tags live -run Live -timeout 5m ./...
    - name: Secrets (store)
      working-directory: secrets/store
      run: go mod verify && go vet ./... && go test -race -timeout 5m ./...
    - name: CLI (ringil)
      working-directory: cmd/ringil
      run: go mod verify && go vet ./... && go test -race -timeout 8m ./...
    - name: Secrets (Vault, live)
      # A Vault dev server on the Linux runner: the store against the real
      # API at every push.
      if: runner.os == 'Linux'
      run: |
        docker run -d --name vault --cap-add=IPC_LOCK -p 127.0.0.1:8200:8200 -e VAULT_DEV_ROOT_TOKEN_ID=ci-root hashicorp/vault:1.19
        for i in $(seq 30); do curl -sf http://127.0.0.1:8200/v1/sys/health >/dev/null && break; sleep 1; done
        VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=ci-root go test -tags live -run LiveVault -v ./secrets/vault/

  lint:
    name: Lint and security
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        check-latest: true
        cache: true
    - name: Install tools
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@latest
        go install github.com/kisielk/errcheck@latest
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        go install golang.org/x/vuln/cmd/govulncheck@latest
        go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
    - name: Format
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
    - name: Checks
      run: make lint security
    - name: Checks (CLI)
      working-directory: cmd/ringil
      run: test -z "$(gofmt -l .)" && make lint security
    - name: Cross-platform vet
      # The sandbox has per-architecture and per-OS code paths.
      run: |
        for m in . mcp otel a2a channel/slack memory/sqlite provider/anthropic secrets/keyring secrets/store cmd/ringil; do
          (cd $m && GOARCH=arm64 go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...) || exit 1
        done
